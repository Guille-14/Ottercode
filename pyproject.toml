[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ottercode"
version = "3.0.0"
description = "Orquestador local de agentes autónomos con Ollama y MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "sqlite-vec>=0.1.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["dev"]
