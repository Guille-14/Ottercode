services:
  ottercode:
    build: .
    ports:
      - "8000:8000"
    environment:
      OTTERCODE_HOST: "0.0.0.0"
      OTTERCODE_OLLAMA: "http://ollama:11434"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      OLLAMA_MAX_LOADED_MODELS: "1"
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:latest
    gpus: all
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      OLLAMA_MAX_LOADED_MODELS: "1"
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
volumes:
  ollama:
