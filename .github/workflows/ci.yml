name: ci
on:
  push:
  pull_request:
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -e .
      - run: npm ci && npm run build
      - run: OTTERCODE_ASK_PERMISSIONS=0 OTTERCODE_SANDBOX_REQUIRED=0 python dev/selftest.py
      - run: python dev/eval_harness.py
